spring:
  application:
    name: api-gateway

  cloud:
    gateway:
      server:
        webflux:
          routes:

            - id: ride-service
              uri: lb://ride-service
              predicates:
                - Path=/api/v1/rides/**
              filters:
                - StripPrefix=2

            - id: location-service
              uri: lb://location-service
              predicates:
                - Path=/api/v1/locations/**
              filters:
                - StripPrefix=2

            - id: driver-service
              uri: lb://driver-service
              predicates:
                - Path=/api/v1/drivers/**
              filters:
                - StripPrefix=2

server:
  port: 8080

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    hostname: localhost
    prefer-ip-address: false

---
# Applies ONLY when running inside Kubernetes
spring:
  config:
    activate:
      on-cloud-platform: kubernetes

eureka:
  client:
    service-url:
      defaultZone: http://service-registry:8761/eureka/
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info