# deploy/argocd/apps/ride-service.yaml
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: ride-service
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/javamahendra/ride_booking_backend.git
    targetRevision: HEAD
    path: deploy/helm-charts/ride-service
    helm:
      valueFiles:
        - values.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: rideshare
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true