apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: rideshare-root
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/javamahendra/ride_booking_backend.git
    targetRevision: HEAD
    path: deploy/argocd/apps
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true