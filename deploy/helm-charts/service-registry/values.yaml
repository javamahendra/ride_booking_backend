replicaCount: 1

image:
  repository: YOUR_AWS_ACCOUNT_ID.dkr.ecr.ap-south-1.amazonaws.com/service-registry
  tag: "latest"
  pullPolicy: IfNotPresent

fullnameOverride: "service-registry"

service:
  type: ClusterIP                       # Private only
  port: 8761
  targetPort: 8761

resources:
  requests:
    cpu: 200m
    memory: 512Mi
  limits:
    cpu: 500m
    memory: 1Gi

env:
  - name: SPRING_PROFILES_ACTIVE
    value: "k8s"
  - name: SERVER_PORT
    value: "8761"
  - name: EUREKA_CLIENT_REGISTER_WITH_EUREKA
    value: "false"
  - name: EUREKA_CLIENT_FETCH_REGISTRY
    value: "false"

livenessProbe:
  httpGet:
    path: /actuator/health
    port: 8761
  initialDelaySeconds: 40
  periodSeconds: 15

readinessProbe:
  httpGet:
    path: /actuator/health
    port: 8761
  initialDelaySeconds: 30
  periodSeconds: 10