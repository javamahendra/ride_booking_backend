#Application
server:
  port: 8085
spring:
  application:
    name: driver-service

  #PostgreSQL Database
  datasource:
    url: jdbc:postgresql://localhost:5432/ride_db
    username: root
    password: root

  #JPA
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  #kafka
  kafka:
    bootstrap-servers: localhost:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JacksonJsonSerializer

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/

  instance:
    hostname: localhost
    prefer-ip-address: false

---
# Applies ONLY when running inside Kubernetes
spring:
  config:
    activate:
      on-cloud-platform: kubernetes
    import: optional:configtree:/etc/secrets/

  datasource:
    url: jdbc:postgresql://postgres:5432/ride_db     # CHANGE: your real DB host

  jpa:
    show-sql: false

  kafka:
    bootstrap-servers: kafka:9092                    # CHANGE: your real Kafka host

eureka:
  client:
    service-url:
      defaultZone: http://service-registry:8761/eureka/
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info