#Application
server:
  port: 8084
spring:
  application:
    name: matching-service

  datasource:
    url: jdbc:postgresql://localhost:5432/ride_db
    username: root
    password: root

  #JPA
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  #Kafka Consumer
  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: matching-service-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring:
          json:
            trusted:
              packages: "*"
            use:
              type:
                headers: false
            value:
              default:
                type: com.rideshare.matching_service.event.RideRequestedEvent
    #Kafka Producer
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer


#Actuator
management:
  endpoints:
    web:
      exposure:
        include: health, info

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/

  instance:
    hostname: localhost
    prefer-ip-address: false


resilience4j:
  circuitbreaker:
    instances:
      locationService:
        slidingWindowType: COUNT_BASED
        slidingWindowSize: 5
        minimumNumberOfCalls: 5
        failureRateThreshold: 50
        waitDurationInOpenState: 10s
        permittedNumberOfCallsInHalfOpenState: 2

  retry:
    instances:
      locationService:
        maxAttempts: 3
        waitDuration: 1s
        enableExponentialBackoff: true
        exponentialBackoffMultiplier: 2
        enableRandomizedWait: true

  ratelimiter:
    instances:
      locationService:
        limitForPeriod: 5
        limitRefreshPeriod: 1s
        timeoutDuration: 0ms

logging:
  level:
    io.github.resilience4j.ratelimiter: DEBUG

---
# Applies ONLY when running inside Kubernetes
spring:
  config:
    activate:
      on-cloud-platform: kubernetes
    import: optional:configtree:/etc/secrets/

  datasource:
    url: jdbc:postgresql://postgres:5432/ride_db     # CHANGE: your real DB host

  jpa:
    hibernate:
      ddl-auto: update                               # CHANGED from create
    show-sql: false

  kafka:
    bootstrap-servers: kafka:9092                    # CHANGE: your real Kafka host

eureka:
  client:
    service-url:
      defaultZone: http://service-registry:8761/eureka/
  instance:
    prefer-ip-address: true

logging:
  level:
    io.github.resilience4j.ratelimiter: INFO