server:
  port: 8761

spring:
  application:
    name: service-registry

eureka:
  client:
    register-with-eureka: false
    fetch-registry: false

---
# Applies ONLY when running inside Kubernetes
spring:
  config:
    activate:
      on-cloud-platform: kubernetes

management:
  endpoints:
    web:
      exposure:
        include: health,info